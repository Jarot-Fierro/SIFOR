{% extends 'index/layout.html' %}

{% block body %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg border-0 rounded-4 w-100" style="max-width: 560px;">
        <div class="card-body p-4 text-center">
            <h3 class="fw-bold mb-3">Ya respondiste este formulario</h3>
            <p class="text-muted mb-4">Tu respuesta para el formulario <strong>{{ form.title }}</strong> ya fue registrada y solo se permite responder una vez.</p>
            <div class="d-grid gap-2">
                <button onclick="window.close();" class="btn btn-dark btn-lg rounded-3">
                    Cerrar ventana
                </button>
                <p class="small text-muted mt-2">Ya puedes cerrar esta pestaña de forma segura.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
