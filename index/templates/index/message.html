{% extends 'index/layout.html' %}

{% block body %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg border-0 rounded-4 w-100" style="max-width: 560px;">
        <div class="card-body p-4 text-center">
            <h3 class="fw-bold mb-3">{{ title|default:"Información" }}</h3>
            <p class="text-muted mb-4">{{ message }}</p>
            {% if form %}
                <p class="text-muted mb-4">Formulario: <strong>{{ form.title }}</strong></p>
            {% endif %}
            <div class="d-grid gap-2">
                {% if user.is_authenticated %}
                    <a href="{% url 'view_forms_visits' %}" class="btn btn-primary btn-lg rounded-3">
                        Volver al listado
                    </a>
                {% else %}
                    <button onclick="window.close();" class="btn btn-dark btn-lg rounded-3">
                        Cerrar ventana
                    </button>
                    <a href="#" onclick="window.history.back(); return false;" class="btn btn-outline-secondary btn-lg rounded-3">
                        Volver
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
